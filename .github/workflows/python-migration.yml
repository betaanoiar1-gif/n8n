name: Python migration checks
on:
  push:
    branches: [python-migration]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m py_compile python_growth_os/*.py
      - run: node -e "const fs=require('fs'),vm=require('vm'); new vm.Script(fs.readFileSync('python_growth_os/js_bridge.js','utf8')); console.log('JS bridge syntax OK')"
      - run: python -m json.tool workflow_source.json >/dev/null
